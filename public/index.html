<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Juego Online</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #20232a;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

        }


        /* =========================
           MENÚ
        ========================= */

        #menu {

            width: 400px;

            max-width: 90%;

            margin: 60px auto;

            background: #2c3038;

            padding: 30px;

            border-radius: 15px;

        }


        input,
        button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

        }


        button {

            background: #4caf50;

            color: white;

            cursor: pointer;

        }


        button:hover {

            background: #45a049;

        }


        #codigoSala {

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 5px;

        }


        /* =========================
           SELECCIÓN DE ROL
        ========================= */

        #seleccionRol {

            display: none;

            width: 400px;

            max-width: 90%;

            margin: 60px auto;

            background: #2c3038;

            padding: 30px;

            border-radius: 15px;

        }


        .rol {

            padding: 20px;

            margin-top: 15px;

            border: 3px solid transparent;

            border-radius: 12px;

            cursor: pointer;

        }


        .rol:hover {

            border-color: white;

        }


        #botonAliado {

            background: #2980b9;

        }


        #botonEnemigo {

            background: #c0392b;

        }


        #botonEnemigo:disabled {

            background: #555;

            cursor: not-allowed;

            opacity: 0.6;

        }


        #rolElegido {

            margin-top: 15px;

            font-weight: bold;

        }


        #estadoRoles {

            margin-top: 20px;

            line-height: 1.8;

        }


        /* =========================
           JUEGO
        ========================= */

        #juego {

            display: none;

        }


        #informacion {

            padding: 10px;

        }


        #cancha {

            width: 800px;

            height: 500px;

            max-width: 95vw;

            margin: auto;

            background: #6ab04c;

            border: 5px solid white;

            position: relative;

            overflow: hidden;

        }


        /* =========================
           JUGADORES
        ========================= */

        .jugador {

            width: 40px;

            height: 40px;

            position: absolute;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            transition:
                background 0.2s,
                opacity 0.2s;

        }


        .aliado {

            background: #3498db;

        }


        .enemigo {

            background: #e74c3c;

        }


        .muerto {

            background: #777 !important;

            opacity: 0.7;

        }


        /* =========================
           MENSAJES
        ========================= */

        #mensaje {

            color: #ffd166;

            margin-top: 15px;

        }


        #mensajeJuego {

            font-size: 22px;

            font-weight: bold;

            min-height: 30px;

        }

    </style>

</head>


<body>


    <!-- ================================================= -->
    <!-- MENÚ -->
    <!-- ================================================= -->

    <div id="menu">

        <h1>🎮 Juego Online</h1>


        <h2>Crear sala</h2>


        <button id="crearSala">

            Crear sala

        </button>


        <hr>


        <h2>Unirse</h2>


        <input
            type="text"
            id="codigoInput"
            maxlength="5"
            placeholder="Código de sala"
        >


        <button id="unirseSala">

            Unirse a sala

        </button>


        <p id="mensaje"></p>

    </div>



    <!-- ================================================= -->
    <!-- SELECCIÓN DE ROL -->
    <!-- ================================================= -->

    <div id="seleccionRol">

        <h1>⚔️ Elegí tu equipo</h1>


        <p>

            Sala:
            <strong id="codigoSalaRol"></strong>

        </p>


        <div
            id="botonAliado"
            class="rol"
        >

            🔵

            <h2>ALIADO</h2>

            <p>
                Tu objetivo es sobrevivir.
            </p>

        </div>


        <div
            id="botonEnemigo"
            class="rol"
        >

            🔴

            <h2>ENEMIGO</h2>

            <p>
                Tocá a los 3 aliados.
            </p>

        </div>


        <div id="estadoRoles">

            🔵 Aliados:
            <span id="cantidadAliados">0</span>/3

            <br>

            🔴 Enemigo:
            <span id="estadoEnemigo">
                Disponible
            </span>

        </div>


        <div id="rolElegido">

            No elegiste un equipo.

        </div>


        <p id="mensajeRol"></p>

    </div>



    <!-- ================================================= -->
    <!-- JUEGO -->
    <!-- ================================================= -->

    <div id="juego">


        <div id="informacion">

            <h2>

                Sala:
                <span id="codigoSala"></span>

            </h2>


            <p>

                Jugadores:
                <span id="cantidadJugadores">
                    0
                </span>/4

            </p>


            <p>

                Usá W A S D para moverte.

            </p>


            <div id="mensajeJuego"></div>

        </div>


        <div id="cancha"></div>


    </div>



    <script src="/socket.io/socket.io.js"></script>


    <script>


        // =================================================
        // SOCKET
        // =================================================

        const socket = io();


        // =================================================
        // ELEMENTOS
        // =================================================

        const menu =
            document.getElementById("menu");


        const seleccionRol =
            document.getElementById(
                "seleccionRol"
            );


        const juego =
            document.getElementById("juego");


        const crearSala =
            document.getElementById("crearSala");


        const unirseSala =
            document.getElementById("unirseSala");


        const codigoInput =
            document.getElementById("codigoInput");


        const codigoSalaRol =
            document.getElementById(
                "codigoSalaRol"
            );


        const codigoSala =
            document.getElementById(
                "codigoSala"
            );


        const cantidadJugadores =
            document.getElementById(
                "cantidadJugadores"
            );


        const botonAliado =
            document.getElementById(
                "botonAliado"
            );


        const botonEnemigo =
            document.getElementById(
                "botonEnemigo"
            );


        const cantidadAliados =
            document.getElementById(
                "cantidadAliados"
            );


        const estadoEnemigo =
            document.getElementById(
                "estadoEnemigo"
            );


        const rolElegido =
            document.getElementById(
                "rolElegido"
            );


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        const mensajeRol =
            document.getElementById(
                "mensajeRol"
            );


        const mensajeJuego =
            document.getElementById(
                "mensajeJuego"
            );


        const cancha =
            document.getElementById(
                "cancha"
            );


        // =================================================
        // JUGADOR
        // =================================================

        let miId = null;

        let miRol = null;

        let miJugador = {

            x: 200,

            y: 200

        };


        let partidaComenzada = false;

        let teclas = {};


        // =================================================
        // CONEXIÓN
        // =================================================

        socket.on(
            "connect",
            () => {

                miId = socket.id;

                console.log(
                    "Conectado:",
                    miId
                );

            }
        );


        // =================================================
        // CREAR SALA
        // =================================================

        crearSala.addEventListener(
            "click",
            () => {

                socket.emit(
                    "crearSala"
                );

            }
        );


        // =================================================
        // UNIRSE
        // =================================================

        unirseSala.addEventListener(
            "click",
            () => {

                const codigo =
                    codigoInput.value
                        .trim()
                        .toUpperCase();


                if (!codigo) {

                    mensaje.textContent =
                        "Escribí un código.";

                    return;

                }


                socket.emit(
                    "unirseSala",
                    codigo
                );

            }
        );


        // =================================================
        // ENTRÓ A LA SALA
        // =================================================

        socket.on(
            "salaCreada",
            (datos) => {

                menu.style.display =
                    "none";


                seleccionRol.style.display =
                    "block";


                codigoSalaRol.textContent =
                    datos.codigo;

            }
        );


        // =================================================
        // ELEGIR ALIADO
        // =================================================

        botonAliado.addEventListener(
            "click",
            () => {

                socket.emit(
                    "elegirRol",
                    "aliado"
                );

            }
        );


        // =================================================
        // ELEGIR ENEMIGO
        // =================================================

        botonEnemigo.addEventListener(
            "click",
            () => {

                if (
                    botonEnemigo.disabled
                ) {

                    return;

                }


                socket.emit(
                    "elegirRol",
                    "enemigo"
                );

            }
        );


        // =================================================
        // ACTUALIZAR ROLES
        // =================================================

        socket.on(
            "actualizarRoles",
            (datos) => {

                cantidadAliados.textContent =
                    datos.aliados;


                if (datos.enemigo) {

                    estadoEnemigo.textContent =
                        "Ocupado";

                    botonEnemigo.disabled =
                        true;

                } else {

                    estadoEnemigo.textContent =
                        "Disponible";

                    botonEnemigo.disabled =
                        false;

                }

            }
        );


        // =================================================
        // ERROR DE ROL
        // =================================================

        socket.on(
            "errorRol",
            (texto) => {

                mensajeRol.textContent =
                    texto;

            }
        );


        // =================================================
        // PARTIDA INICIADA
        // =================================================

        socket.on(
            "partidaIniciada",
            () => {

                partidaComenzada =
                    true;


                seleccionRol.style.display =
                    "none";


                juego.style.display =
                    "block";


                mensajeJuego.textContent =
                    "¡La partida comenzó!";

            }
        );


        // =================================================
        // ACTUALIZAR JUGADORES
        // =================================================

        socket.on(
            "actualizarJugadores",
            (jugadores) => {

                cantidadJugadores.textContent =
                    jugadores.length;


                mostrarJugadores(
                    jugadores
                );

            }
        );


        // =================================================
        // MOSTRAR JUGADORES
        // =================================================

        function mostrarJugadores(
            jugadores
        ) {

            jugadores.forEach(
                (jugador) => {


                    let elemento =
                        document.getElementById(
                            "jugador-" +
                            jugador.id
                        );


                    if (!elemento) {

                        elemento =
                            document.createElement(
                                "div"
                            );


                        elemento.id =
                            "jugador-" +
                            jugador.id;


                        elemento.classList.add(
                            "jugador"
                        );


                        cancha.appendChild(
                            elemento
                        );

                    }


                    // Limpiar clases

                    elemento.classList.remove(
                        "aliado",
                        "enemigo",
                        "muerto"
                    );


                    // Color según rol

                    if (
                        jugador.rol ===
                        "enemigo"
                    ) {

                        elemento.classList.add(
                            "enemigo"
                        );

                    } else {

                        elemento.classList.add(
                            "aliado"
                        );

                    }


                    // Muerto

                    if (
                        jugador.muerto
                    ) {

                        elemento.classList.add(
                            "muerto"
                        );

                    }


                    // Guardar nuestro rol

                    if (
                        jugador.id ===
                        miId
                    ) {

                        miRol =
                            jugador.rol;

                    }


                    // Posición remota

                    if (
                        jugador.id !==
                        miId
                    ) {

                        elemento.style.left =
                            jugador.x + "px";


                        elemento.style.top =
                            jugador.y + "px";

                    }

                }
            );


            // =========================================
            // ELIMINAR DESCONECTADOS
            // =========================================

            const idsActuales =
                jugadores.map(
                    jugador =>
                        "jugador-" +
                        jugador.id
                );


            document
                .querySelectorAll(
                    ".jugador"
                )
                .forEach(
                    (elemento) => {

                        if (
                            !idsActuales.includes(
                                elemento.id
                            )
                        ) {

                            elemento.remove();

                        }

                    }
                );


            // =========================================
            // DIBUJAR JUGADOR LOCAL
            // =========================================

            const jugadorLocal =
                document.getElementById(
                    "jugador-" +
                    miId
                );


            if (jugadorLocal) {

                jugadorLocal.style.left =
                    miJugador.x + "px";


                jugadorLocal.style.top =
                    miJugador.y + "px";

            }

        }


        // =================================================
        // ALIADO MUERE
        // =================================================

        socket.on(
            "aliadoMuerto",
            (datos) => {

                const jugador =
                    document.getElementById(
                        "jugador-" +
                        datos.id
                    );


                if (jugador) {

                    jugador.classList.add(
                        "muerto"
                    );

                }


                if (
                    datos.id === miId
                ) {

                    // Detener movimiento

                    teclas = {};


                    mensajeJuego.textContent =
                        "💀 ¡Fuiste eliminado!";

                }

            }
        );


        // =================================================
        // ENEMIGO GANA
        // =================================================

        socket.on(
            "enemigoGana",
            () => {

                partidaComenzada =
                    false;


                teclas = {};


                mensajeJuego.textContent =
                    "🔴 ¡EL ENEMIGO GANA!";

            }
        );


        // =================================================
        // TECLADO
        // =================================================

        document.addEventListener(
            "keydown",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();


                if (
                    tecla === "w" ||
                    tecla === "a" ||
                    tecla === "s" ||
                    tecla === "d"
                ) {

                    evento.preventDefault();

                    teclas[tecla] =
                        true;

                }

            }
        );


        document.addEventListener(
            "keyup",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();


                if (
                    tecla === "w" ||
                    tecla === "a" ||
                    tecla === "s" ||
                    tecla === "d"
                ) {

                    teclas[tecla] =
                        false;

                }

            }
        );


        window.addEventListener(
            "blur",
            () => {

                teclas = {};

            }
        );


        // =================================================
        // ENVIAR POSICIÓN
        // =================================================

        let ultimoEnvio = 0;


        function enviarPosicion() {

            const ahora =
                Date.now();


            if (
                ahora - ultimoEnvio < 30
            ) {

                return;

            }


            ultimoEnvio =
                ahora;


            socket.emit(
                "moverJugador",
                {
                    x: miJugador.x,
                    y: miJugador.y
                }
            );

        }


        // =================================================
        // MOVIMIENTO
        // =================================================

        function actualizarMovimiento() {


            if (
                !partidaComenzada
            ) {

                requestAnimationFrame(
                    actualizarMovimiento
                );

                return;

            }


            const velocidad = 5;


            let moviendo = false;


            if (teclas["w"]) {

                miJugador.y -=
                    velocidad;

                moviendo = true;

            }


            if (teclas["s"]) {

                miJugador.y +=
                    velocidad;

                moviendo = true;

            }


            if (teclas["a"]) {

                miJugador.x -=
                    velocidad;

                moviendo = true;

            }


            if (teclas["d"]) {

                miJugador.x +=
                    velocidad;

                moviendo = true;

            }


            // Límites

            miJugador.x =
                Math.max(
                    20,
                    Math.min(
                        780,
                        miJugador.x
                    )
                );


            miJugador.y =
                Math.max(
                    20,
                    Math.min(
                        480,
                        miJugador.y
                    )
                );


            // Dibujar local

            const jugadorLocal =
                document.getElementById(
                    "jugador-" +
                    miId
                );


            if (jugadorLocal) {

                jugadorLocal.style.left =
                    miJugador.x + "px";


                jugadorLocal.style.top =
                    miJugador.y + "px";

            }


            if (moviendo) {

                enviarPosicion();

            }


            requestAnimationFrame(
                actualizarMovimiento
            );

        }


        actualizarMovimiento();

    </script>

</body>

</html>
