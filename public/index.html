```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego Online</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #20232a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #menu {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background: #2c3038;
            padding: 30px;
            border-radius: 15px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #codigoSala {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 15px;
        }

        #juego {
            display: none;
        }

        #informacion {
            padding: 10px;
        }

        #cancha {
            width: 800px;
            height: 500px;
            max-width: 95vw;
            margin: auto;
            background: #6ab04c;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
        }

        .jugador {
            width: 40px;
            height: 40px;
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .jugador1 {
            background: #3498db;
        }

        .otroJugador {
            background: #e74c3c;
        }

        #mensaje {
            color: #ffd166;
            margin-top: 15px;
        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- MENU -->
    <!-- ========================= -->

    <div id="menu">

        <h1>🎮 Juego Online</h1>

        <h2>Crear sala</h2>

        <button id="crearSala">
            Crear sala
        </button>


        <hr>


        <h2>Unirse</h2>

        <input
            type="text"
            id="codigoInput"
            maxlength="5"
            placeholder="Código de sala"
        >

        <button id="unirseSala">
            Unirse a sala
        </button>


        <p id="mensaje"></p>

    </div>



    <!-- ========================= -->
    <!-- JUEGO -->
    <!-- ========================= -->

    <div id="juego">

        <div id="informacion">

            <h2>
                Sala:
                <span id="codigoSala"></span>
            </h2>

            <p>
                Jugadores:
                <span id="cantidadJugadores">0</span>
                /4
            </p>

            <p>
                Usá W A S D para moverte
            </p>

        </div>


        <div id="cancha"></div>

    </div>



    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        const socket = io();


        // =========================
        // ELEMENTOS
        // =========================

        const menu =
            document.getElementById("menu");

        const juego =
            document.getElementById("juego");

        const crearSala =
            document.getElementById("crearSala");

        const unirseSala =
            document.getElementById("unirseSala");

        const codigoInput =
            document.getElementById("codigoInput");

        const codigoSala =
            document.getElementById("codigoSala");

        const cantidadJugadores =
            document.getElementById("cantidadJugadores");

        const cancha =
            document.getElementById("cancha");

        const mensaje =
            document.getElementById("mensaje");


        // =========================
        // JUGADOR LOCAL
        // =========================

        let miId = null;

        let miJugador = {
            x: 200,
            y: 200
        };


        // =========================
        // TECLADO
        // =========================

        const teclas = {};


        // Cuando se conecta
        socket.on("connect", () => {

            miId = socket.id;

            console.log(
                "Conectado:",
                miId
            );

        });


        // =========================
        // CREAR SALA
        // =========================

        crearSala.addEventListener(
            "click",
            () => {

                socket.emit("crearSala");

            }
        );


        // =========================
        // UNIRSE A SALA
        // =========================

        unirseSala.addEventListener(
            "click",
            () => {

                const codigo =
                    codigoInput.value
                        .trim()
                        .toUpperCase();


                if (codigo === "") {

                    mensaje.textContent =
                        "Escribí un código.";

                    return;

                }


                socket.emit(
                    "unirseSala",
                    codigo
                );

            }
        );


        // =========================
        // SALA CREADA
        // =========================

        socket.on(
            "salaCreada",
            (datos) => {

                menu.style.display =
                    "none";

                juego.style.display =
                    "block";


                codigoSala.textContent =
                    datos.codigo;


                cantidadJugadores.textContent =
                    datos.jugadores;

            }
        );


        // =========================
        // ACTUALIZAR JUGADORES
        // =========================

        socket.on(
            "actualizarJugadores",
            (jugadores) => {

                cantidadJugadores.textContent =
                    jugadores.length;


                mostrarJugadores(
                    jugadores
                );

            }
        );


        // =========================
        // ERROR DE SALA
        // =========================

        socket.on(
            "errorSala",
            (texto) => {

                mensaje.textContent =
                    texto;

            }
        );


        // =========================
        // MOSTRAR JUGADORES
        // =========================

        function mostrarJugadores(jugadores) {


            jugadores.forEach(
                (jugador) => {


                    let elemento =
                        document.getElementById(
                            "jugador-" +
                            jugador.id
                        );


                    // Crear jugador si no existe

                    if (!elemento) {

                        elemento =
                            document.createElement(
                                "div"
                            );


                        elemento.id =
                            "jugador-" +
                            jugador.id;


                        elemento.classList.add(
                            "jugador"
                        );


                        if (
                            jugador.id ===
                            miId
                        ) {

                            elemento.classList.add(
                                "jugador1"
                            );

                        } else {

                            elemento.classList.add(
                                "otroJugador"
                            );

                        }


                        cancha.appendChild(
                            elemento
                        );

                    }


                    // IMPORTANTE:
                    //
                    // NO actualizamos la posición
                    // del jugador local.
                    //
                    // El jugador local se mueve
                    // directamente en su navegador.

                    if (
                        jugador.id !==
                        miId
                    ) {

                        elemento.style.left =
                            jugador.x + "px";


                        elemento.style.top =
                            jugador.y + "px";

                    }

                }
            );


            // =========================
            // ELIMINAR DESCONECTADOS
            // =========================

            const idsActuales =
                jugadores.map(
                    jugador =>
                        "jugador-" +
                        jugador.id
                );


            document
                .querySelectorAll(".jugador")
                .forEach(
                    (elemento) => {

                        if (
                            !idsActuales.includes(
                                elemento.id
                            )
                        ) {

                            elemento.remove();

                        }

                    }
                );


            // =========================
            // ASEGURAR POSICIÓN LOCAL
            // =========================

            let jugadorLocal =
                document.getElementById(
                    "jugador-" +
                    miId
                );


            if (jugadorLocal) {

                jugadorLocal.style.left =
                    miJugador.x + "px";

                jugadorLocal.style.top =
                    miJugador.y + "px";

            }

        }


        // =========================
        // TECLA PRESIONADA
        // =========================

        document.addEventListener(
            "keydown",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();


                if (
                    tecla === "w" ||
                    tecla === "a" ||
                    tecla === "s" ||
                    tecla === "d"
                ) {

                    evento.preventDefault();

                    teclas[tecla] = true;

                }

            }
        );


        // =========================
        // TECLA SOLTADA
        // =========================

        document.addEventListener(
            "keyup",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();


                if (
                    tecla === "w" ||
                    tecla === "a" ||
                    tecla === "s" ||
                    tecla === "d"
                ) {

                    teclas[tecla] = false;

                }

            }
        );


        // =========================
        // EVITAR TECLAS TRABADAS
        // =========================

        window.addEventListener(
            "blur",
            () => {

                teclas["w"] = false;
                teclas["a"] = false;
                teclas["s"] = false;
                teclas["d"] = false;

            }
        );


        // =========================
        // ENVIAR POSICIÓN
        // =========================

        let ultimoEnvio = 0;


        function enviarPosicion() {

            const ahora =
                Date.now();


            // Máximo un envío cada 30 ms

            if (
                ahora - ultimoEnvio < 30
            ) {

                return;

            }


            ultimoEnvio = ahora;


            socket.emit(
                "moverJugador",
                {
                    x: miJugador.x,
                    y: miJugador.y
                }
            );

        }


        // =========================
        // MOVIMIENTO
        // =========================

        function actualizarMovimiento() {


            if (
                juego.style.display ===
                "none"
            ) {

                requestAnimationFrame(
                    actualizarMovimiento
                );

                return;

            }


            const velocidad = 5;


            let seEstaMoviendo = false;


            // ARRIBA

            if (teclas["w"]) {

                miJugador.y -=
                    velocidad;

                seEstaMoviendo = true;

            }


            // ABAJO

            if (teclas["s"]) {

                miJugador.y +=
                    velocidad;

                seEstaMoviendo = true;

            }


            // IZQUIERDA

            if (teclas["a"]) {

                miJugador.x -=
                    velocidad;

                seEstaMoviendo = true;

            }


            // DERECHA

            if (teclas["d"]) {

                miJugador.x +=
                    velocidad;

                seEstaMoviendo = true;

            }


            // =========================
            // LIMITES DE LA CANCHA
            // =========================

            miJugador.x =
                Math.max(
                    20,
                    Math.min(
                        780,
                        miJugador.x
                    )
                );


            miJugador.y =
                Math.max(
                    20,
                    Math.min(
                        480,
                        miJugador.y
                    )
                );


            // =========================
            // DIBUJAR JUGADOR LOCAL
            // =========================

            const jugadorLocal =
                document.getElementById(
                    "jugador-" +
                    miId
                );


            if (jugadorLocal) {

                jugadorLocal.style.left =
                    miJugador.x + "px";

                jugadorLocal.style.top =
                    miJugador.y + "px";

            }


            // =========================
            // ENVIAR AL SERVIDOR
            // =========================

            if (seEstaMoviendo) {

                enviarPosicion();

            }


            requestAnimationFrame(
                actualizarMovimiento
            );

        }


        // =========================
        // INICIAR BUCLE
        // =========================

        actualizarMovimiento();


    </script>

</body>

</html>
```
