<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3 vs 1</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            overflow: hidden;
        }

        /* =====================================
           MENÚ
        ===================================== */

        #menu {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;

            z-index: 1000;
        }

        .panel {
            width: 360px;
            padding: 30px;

            background: #222;

            border-radius: 12px;

            text-align: center;
        }

        .panel h1 {
            margin-top: 0;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 10px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border: none;
            border-radius: 6px;

            background: #3498db;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #codigoSala {
            margin-top: 15px;

            padding: 12px;

            background: #333;

            border-radius: 6px;

            font-size: 24px;

            letter-spacing: 4px;
        }

        #estadoMenu {
            margin-top: 15px;

            min-height: 20px;
        }

        /* =====================================
           JUEGO
        ===================================== */

        #juego {
            display: none;

            width: 100vw;
            height: 100vh;

            position: relative;
        }

        #cancha {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 800px;
            height: 500px;

            transform: translate(-50%, -50%);

            overflow: hidden;

            background:
                linear-gradient(
                    #2d8a3e,
                    #287b38
                );

            border: 4px solid white;

            cursor: crosshair;
        }

        /* =====================================
           MUNDO
        ===================================== */

        #mundo {

            position: absolute;

            left: 0;
            top: 0;

            width: 5000px;
            height: 600px;

            transform: translate3d(0, 0, 0);

            will-change: transform;
        }

        /* =====================================
           META
        ===================================== */

        #meta {

            position: absolute;

            left: 4850px;
            top: 0;

            width: 10px;
            height: 600px;

            background: white;

            box-shadow:
                0 0 20px white;
        }

        #textoMeta {

            position: absolute;

            left: 4800px;
            top: 20px;

            width: 110px;

            text-align: center;

            font-weight: bold;

            color: white;

            pointer-events: none;
        }

        /* =====================================
           JUGADORES
        ===================================== */

        .jugador {

            position: absolute;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            transform:
                translate3d(
                    -50%,
                    -50%,
                    0
                );

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 11px;

            font-weight: bold;

            color: white;

            pointer-events: none;

            will-change:
                transform,
                left,
                top;
        }

        .jugador.aliado {
            background: #3498db;
        }

        .jugador.enemigo {
            background: #e74c3c;
        }

        .jugador.local {

            border: 4px solid white;

            box-shadow:
                0 0 15px white;
        }

        .jugador.muerto {

            opacity: 0.3;

            filter: grayscale(1);
        }

        .jugador.ralentizado {

            box-shadow:
                0 0 0 6px rgba(
                    255,
                    230,
                    0,
                    0.35
                );
        }

        /* =====================================
           TRAMPAS
        ===================================== */

        .trampa {

            position: absolute;

            width: 42px;
            height: 42px;

            transform:
                translate3d(
                    -50%,
                    -50%,
                    0
                );

            border-radius: 50%;

            background: #8e44ad;

            border: 3px solid #f1c40f;

            box-shadow:
                0 0 12px
                rgba(
                    241,
                    196,
                    15,
                    0.8
                );

            pointer-events: none;
        }

        /* =====================================
           HUD
        ===================================== */

        #hud {

            position: fixed;

            top: 15px;
            left: 15px;

            z-index: 500;

            min-width: 230px;

            padding: 15px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.75
                );

            border-radius: 10px;

            pointer-events: none;
        }

        #hud div {
            margin-bottom: 6px;
        }

        #hud div:last-child {
            margin-bottom: 0;
        }

        /* =====================================
           MENSAJE CENTRAL
        ===================================== */

        #mensaje {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 900;

            padding: 30px 50px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.9
                );

            border-radius: 15px;

            font-size: 32px;

            font-weight: bold;

            text-align: center;

            display: none;
        }

        /* =====================================
           INDICADOR TRAMPA
        ===================================== */

        #ayudaTrampa {

            position: fixed;

            bottom: 15px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 500;

            padding: 10px 18px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.75
                );

            border-radius: 8px;

            pointer-events: none;

            display: none;
        }

    </style>

</head>

<body>

    <!-- ======================================
         MENÚ
    ======================================= -->

    <div id="menu">

        <div class="panel">

            <h1>3 vs 1</h1>

            <input
                type="text"
                id="nombre"
                placeholder="Tu nombre"
                maxlength="15"
            >

            <button id="crearBtn">
                Crear sala
            </button>

            <input
                type="text"
                id="codigo"
                placeholder="Código de sala"
                maxlength="4"
            >

            <button id="unirseBtn">
                Unirse a sala
            </button>

            <div id="codigoSala"></div>

            <button
                id="aliadoBtn"
                style="display:none;"
            >
                Jugar como aliado
            </button>

            <button
                id="enemigoBtn"
                style="display:none;"
            >
                Jugar como enemigo
            </button>

            <div id="estadoMenu"></div>

        </div>

    </div>

    <!-- ======================================
         JUEGO
    ======================================= -->

    <div id="juego">

        <div id="cancha">

            <div id="mundo">

                <div id="meta"></div>

                <div id="textoMeta">
                    META
                </div>

            </div>

        </div>

        <!-- HUD -->

        <div id="hud">

            <div>
                Rol:
                <strong id="hudRol">
                    -
                </strong>
            </div>

            <div>
                Aliados vivos:
                <strong id="hudAliados">
                    0
                </strong>
                / 3
            </div>

            <div>
                Progreso:
                <strong id="hudProgreso">
                    0%
                </strong>
            </div>

            <div id="hudTrampa">
                Trampa:
                <strong id="hudCooldown">
                    Lista
                </strong>
            </div>

        </div>

        <div id="ayudaTrampa">
            Hacé clic en el mapa para colocar una trampa
        </div>

    </div>

    <div id="mensaje"></div>

    <script>

        // ==========================================
        // SOCKET
        // ==========================================

        const socket = io();

        // ==========================================
        // CONFIGURACIÓN
        // ==========================================

        const ANCHO_PANTALLA = 800;
        const ALTO_PANTALLA = 500;

        const ANCHO_MAPA = 5000;
        const ALTO_MAPA = 600;

        const META_X = 4850;

        const VELOCIDAD_ALIADO = 5;
        const VELOCIDAD_ENEMIGO = 3.5;

        const INTERVALO_ENVIO = 50;

        // ==========================================
        // ESTADO LOCAL
        // ==========================================

        let miId = null;
        let miRol = null;

        let salaActual = null;

        let partidaComenzada = false;

        let miJugador = {

            x: 150,
            y: 300,

            objetivoX: 150,
            objetivoY: 300,

            ralentizadoHasta: 0,

            muerto: false
        };

        let jugadores = {};

        let trampas = {};

        let camaraX = 0;

        let ultimoEnvio = 0;

        let ultimoFrame = performance.now();

        let teclas = {};

        let cooldownTrampaHasta = 0;

        // ==========================================
        // ELEMENTOS
        // ==========================================

        const menu =
            document.getElementById("menu");

        const juego =
            document.getElementById("juego");

        const cancha =
            document.getElementById("cancha");

        const mundo =
            document.getElementById("mundo");

        const nombreInput =
            document.getElementById("nombre");

        const codigoInput =
            document.getElementById("codigo");

        const crearBtn =
            document.getElementById("crearBtn");

        const unirseBtn =
            document.getElementById("unirseBtn");

        const aliadoBtn =
            document.getElementById("aliadoBtn");

        const enemigoBtn =
            document.getElementById("enemigoBtn");

        const codigoSala =
            document.getElementById("codigoSala");

        const estadoMenu =
            document.getElementById("estadoMenu");

        const mensaje =
            document.getElementById("mensaje");

        const ayudaTrampa =
            document.getElementById("ayudaTrampa");

        const hudRol =
            document.getElementById("hudRol");

        const hudAliados =
            document.getElementById("hudAliados");

        const hudProgreso =
            document.getElementById("hudProgreso");

        const hudCooldown =
            document.getElementById("hudCooldown");

        // ==========================================
        // CREAR SALA
        // ==========================================

        crearBtn.addEventListener(
            "click",
            () => {

                const nombre =
                    nombreInput.value.trim() ||
                    "Jugador";

                socket.emit(
                    "crearSala",
                    {
                        nombre
                    }
                );
            }
        );

        // ==========================================
        // UNIRSE
        // ==========================================

        unirseBtn.addEventListener(
            "click",
            () => {

                const codigo =
                    codigoInput.value
                        .trim()
                        .toUpperCase();

                const nombre =
                    nombreInput.value.trim() ||
                    "Jugador";

                if (!codigo) {

                    estadoMenu.textContent =
                        "Ingresá un código.";

                    return;
                }

                socket.emit(
                    "unirseSala",
                    {
                        codigo,
                        nombre
                    }
                );
            }
        );

        // ==========================================
        // SALA CREADA
        // ==========================================

        socket.on(
            "salaCreada",
            datos => {

                salaActual =
                    datos.codigo;

                codigoSala.textContent =
                    `Código: ${datos.codigo}`;

                estadoMenu.textContent =
                    "Elegí tu rol.";

                aliadoBtn.style.display =
                    "block";

                enemigoBtn.style.display =
                    "block";
            }
        );

        // ==========================================
        // SALA UNIDA
        // ==========================================

        socket.on(
            "salaUnida",
            datos => {

                salaActual =
                    datos.codigo;

                codigoSala.textContent =
                    `Sala: ${datos.codigo}`;

                estadoMenu.textContent =
                    "Elegí tu rol.";

                aliadoBtn.style.display =
                    "block";

                enemigoBtn.style.display =
                    "block";
            }
        );

        // ==========================================
        // ERRORES
        // ==========================================

        socket.on(
            "errorSala",
            texto => {

                estadoMenu.textContent =
                    texto;
            }
        );

        socket.on(
            "errorRol",
            texto => {

                estadoMenu.textContent =
                    texto;
            }
        );

        // ==========================================
        // ELEGIR ALIADO
        // ==========================================

        aliadoBtn.addEventListener(
            "click",
            () => {

                socket.emit(
                    "elegirRol",
                    "aliado"
                );

                estadoMenu.textContent =
                    "Rol seleccionado: aliado";
            }
        );

        // ==========================================
        // ELEGIR ENEMIGO
        // ==========================================

        enemigoBtn.addEventListener(
            "click",
            () => {

                socket.emit(
                    "elegirRol",
                    "enemigo"
                );

                estadoMenu.textContent =
                    "Rol seleccionado: enemigo";
            }
        );

        // ==========================================
        // ACTUALIZAR ROLES
        // ==========================================

        socket.on(
            "actualizarRoles",
            datos => {

                jugadores = datos;

                actualizarMenuRoles();
            }
        );

        function actualizarMenuRoles() {

            let aliados = 0;
            let enemigo = 0;

            for (const id in jugadores) {

                const jugador =
                    jugadores[id];

                if (jugador.rol === "aliado") {
                    aliados++;
                }

                if (jugador.rol === "enemigo") {
                    enemigo++;
                }
            }

            estadoMenu.innerHTML =
                `
                Aliados: ${aliados}/3<br>
                Enemigos: ${enemigo}/1
                `;
        }

        // ==========================================
        // PARTIDA INICIADA
        // ==========================================

        socket.on(
            "partidaIniciada",
            estado => {

                partidaComenzada = true;

                menu.style.display =
                    "none";

                juego.style.display =
                    "block";

                procesarEstado(estado);

                mostrarMensaje(
                    "¡Comienza la partida!",
                    1200
                );

                requestAnimationFrame(
                    loop
                );
            }
        );

        // ==========================================
        // ESTADO DEL SERVIDOR
        // ==========================================

        socket.on(
            "actualizarMapa",
            estado => {

                procesarEstado(estado);
            }
        );

        function procesarEstado(estado) {

            if (!estado) return;

            // --------------------------------------
            // JUGADORES
            // --------------------------------------

            if (estado.jugadores) {

                for (
                    const id in estado.jugadores
                ) {

                    const nuevo =
                        estado.jugadores[id];

                    if (
                        id === miId
                    ) {

                        // No pisamos continuamente
                        // nuestro movimiento local.

                        if (
                            !miJugador.muerto &&
                            !nuevo.muerto
                        ) {

                            const diferencia =
                                distancia(
                                    miJugador.x,
                                    miJugador.y,
                                    nuevo.x,
                                    nuevo.y
                                );

                            /*
                             * Si la diferencia es pequeña,
                             * dejamos que el movimiento local
                             * siga libremente.
                             */

                            if (diferencia > 80) {

                                miJugador.x =
                                    nuevo.x;

                                miJugador.y =
                                    nuevo.y;
                            }
                        }

                        miJugador.muerto =
                            nuevo.muerto;

                        miJugador.ralentizadoHasta =
                            nuevo.ralentizadoHasta;

                        miJugador.objetivoX =
                            nuevo.x;

                        miJugador.objetivoY =
                            nuevo.y;

                    } else {

                        // ----------------------------------
                        // JUGADORES REMOTOS
                        // ----------------------------------

                        if (!jugadores[id]) {

                            jugadores[id] = {

                                ...nuevo,

                                renderX: nuevo.x,
                                renderY: nuevo.y,

                                objetivoX: nuevo.x,
                                objetivoY: nuevo.y
                            };

                        } else {

                            jugadores[id].rol =
                                nuevo.rol;

                            jugadores[id].nombre =
                                nuevo.nombre;

                            jugadores[id].muerto =
                                nuevo.muerto;

                            jugadores[id].ralentizadoHasta =
                                nuevo.ralentizadoHasta;

                            jugadores[id].objetivoX =
                                nuevo.x;

                            jugadores[id].objetivoY =
                                nuevo.y;
                        }
                    }
                }
            }

            // --------------------------------------
            // TRAMPAS
            // --------------------------------------

            if (estado.trampas) {

                const nuevasTrampas = {};

                for (
                    const trampa of estado.trampas
                ) {

                    nuevasTrampas[trampa.id] =
                        trampa;

                    if (
                        !trampas[trampa.id]
                    ) {

                        crearTrampaVisual(
                            trampa
                        );
                    }
                }

                // Eliminar visuales que ya no existen

                for (
                    const id in trampas
                ) {

                    if (
                        !nuevasTrampas[id]
                    ) {

                        const elemento =
                            document.getElementById(
                                `trampa-${id}`
                            );

                        if (elemento) {
                            elemento.remove();
                        }
                    }
                }

                trampas =
                    nuevasTrampas;
            }

            actualizarHUD();
        }

        // ==========================================
        // IDENTIFICACIÓN
        // ==========================================

        socket.on(
            "connect",
            () => {

                miId =
                    socket.id;
            }
        );

        // ==========================================
        // LOOP PRINCIPAL
        // ==========================================

        function loop(ahora) {

            if (!partidaComenzada) {
                return;
            }

            const delta =
                Math.min(
                    ahora - ultimoFrame,
                    50
                );

            ultimoFrame = ahora;

            actualizarMovimiento(delta);

            interpolarJugadores();

            actualizarCamara();

            renderizarJugadores();

            renderizarTrampas();

            actualizarHUD();

            requestAnimationFrame(
                loop
            );
        }

        // ==========================================
        // TECLADO
        // ==========================================

        window.addEventListener(
            "keydown",
            event => {

                const tecla =
                    event.key.toLowerCase();

                if (
                    [
                        "w",
                        "a",
                        "s",
                        "d",
                        "arrowup",
                        "arrowdown",
                        "arrowleft",
                        "arrowright"
                    ].includes(tecla)
                ) {

                    event.preventDefault();

                    teclas[tecla] = true;
                }
            }
        );

        window.addEventListener(
            "keyup",
            event => {

                const tecla =
                    event.key.toLowerCase();

                teclas[tecla] = false;
            }
        );

        // ==========================================
        // MOVIMIENTO LOCAL
        // ==========================================

        function actualizarMovimiento(delta) {

            if (
                miJugador.muerto ||
                !partidaComenzada
            ) {
                return;
            }

            let dx = 0;
            let dy = 0;

            if (
                teclas["w"] ||
                teclas["arrowup"]
            ) {
                dy -= 1;
            }

            if (
                teclas["s"] ||
                teclas["arrowdown"]
            ) {
                dy += 1;
            }

            if (
                teclas["a"] ||
                teclas["arrowleft"]
            ) {
                dx -= 1;
            }

            if (
                teclas["d"] ||
                teclas["arrowright"]
            ) {
                dx += 1;
            }

            if (
                dx === 0 &&
                dy === 0
            ) {
                enviarPosicionSiCorresponde();
                return;
            }

            // Normalizar diagonal

            const longitud =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            dx /= longitud;
            dy /= longitud;

            let velocidad =
                miRol === "enemigo"
                    ? VELOCIDAD_ENEMIGO
                    : VELOCIDAD_ALIADO;

            // Ralentización

            if (
                Date.now() <
                miJugador.ralentizadoHasta
            ) {

                velocidad *= 0.45;
            }

            /*
             * velocidad está expresada aproximadamente
             * en píxeles por frame a 60 FPS.
             */

            const factorFrame =
                delta / 16.6667;

            miJugador.x +=
                dx *
                velocidad *
                factorFrame;

            miJugador.y +=
                dy *
                velocidad *
                factorFrame;

            // --------------------------------------
            // LÍMITES
            // --------------------------------------

            miJugador.x =
                Math.max(
                    20,
                    Math.min(
                        ANCHO_MAPA - 20,
                        miJugador.x
                    )
                );

            miJugador.y =
                Math.max(
                    20,
                    Math.min(
                        ALTO_MAPA - 20,
                        miJugador.y
                    )
                );

            enviarPosicionSiCorresponde();
        }

        // ==========================================
        // ENVIAR POSICIÓN
        // ==========================================

        function enviarPosicionSiCorresponde() {

            const ahora =
                performance.now();

            if (
                ahora - ultimoEnvio <
                INTERVALO_ENVIO
            ) {
                return;
            }

            ultimoEnvio = ahora;

            socket.emit(
                "moverJugador",
                {
                    x: miJugador.x,
                    y: miJugador.y
                }
            );
        }

        // ==========================================
        // INTERPOLACIÓN
        // ==========================================

        function interpolarJugadores() {

            for (
                const id in jugadores
            ) {

                if (id === miId) {
                    continue;
                }

                const jugador =
                    jugadores[id];

                if (
                    jugador.renderX === undefined
                ) {

                    jugador.renderX =
                        jugador.objetivoX;

                    jugador.renderY =
                        jugador.objetivoY;
                }

                /*
                 * Interpolación exponencial.
                 *
                 * Esto hace que los jugadores remotos
                 * se desplacen suavemente aunque el
                 * servidor mande actualizaciones cada 50 ms.
                 */

                const factor = 0.25;

                jugador.renderX +=
                    (
                        jugador.objetivoX -
                        jugador.renderX
                    ) *
                    factor;

                jugador.renderY +=
                    (
                        jugador.objetivoY -
                        jugador.renderY
                    ) *
                    factor;
            }
        }

        // ==========================================
        // CÁMARA
        // ==========================================

        function actualizarCamara() {

            const centroJugador =
                miJugador.x;

            camaraX =
                centroJugador -
                ANCHO_PANTALLA / 2;

            camaraX =
                Math.max(
                    0,
                    Math.min(
                        ANCHO_MAPA -
                        ANCHO_PANTALLA,
                        camaraX
                    )
                );

            mundo.style.transform =
                `translate3d(${-camaraX}px, 0, 0)`;
        }

        // ==========================================
        // RENDERIZAR JUGADORES
        // ==========================================

        function renderizarJugadores() {

            // --------------------------------------
            // JUGADOR LOCAL
            // --------------------------------------

            renderizarJugador(
                miId,
                {
                    id: miId,
                    nombre: "Tú",
                    rol: miRol,
                    x: miJugador.x,
                    y: miJugador.y,
                    muerto: miJugador.muerto,
                    ralentizadoHasta:
                        miJugador.ralentizadoHasta
                },
                true
            );

            // --------------------------------------
            // JUGADORES REMOTOS
            // --------------------------------------

            for (
                const id in jugadores
            ) {

                if (id === miId) {
                    continue;
                }

                const jugador =
                    jugadores[id];

                renderizarJugador(
                    id,
                    {
                        ...jugador,
                        x: jugador.renderX,
                        y: jugador.renderY
                    },
                    false
                );
            }
        }

        function renderizarJugador(
            id,
            jugador,
            local
        ) {

            let elemento =
                document.getElementById(
                    `jugador-${id}`
                );

            if (!elemento) {

                elemento =
                    document.createElement(
                        "div"
                    );

                elemento.id =
                    `jugador-${id}`;

                elemento.classList.add(
                    "jugador"
                );

                mundo.appendChild(
                    elemento
                );
            }

            elemento.className =
                "jugador " +
                jugador.rol;

            if (local) {
                elemento.classList.add(
                    "local"
                );
            }

            if (jugador.muerto) {

                elemento.classList.add(
                    "muerto"
                );
            }

            if (
                Date.now() <
                jugador.ralentizadoHasta
            ) {

                elemento.classList.add(
                    "ralentizado"
                );
            }

            elemento.textContent =
                local
                    ? "TÚ"
                    : (
                        jugador.nombre ||
                        jugador.rol
                    );

            elemento.style.left =
                `${jugador.x}px`;

            elemento.style.top =
                `${jugador.y}px`;
        }

        // ==========================================
        // TRAMPAS
        // ==========================================

        function crearTrampaVisual(
            trampa
        ) {

            const elemento =
                document.createElement(
                    "div"
                );

            elemento.id =
                `trampa-${trampa.id}`;

            elemento.className =
                "trampa";

            mundo.appendChild(
                elemento
            );

            elemento.style.left =
                `${trampa.x}px`;

            elemento.style.top =
                `${trampa.y}px`;
        }

        function renderizarTrampas() {

            for (
                const id in trampas
            ) {

                const trampa =
                    trampas[id];

                const elemento =
                    document.getElementById(
                        `trampa-${id}`
                    );

                if (!elemento) {
                    continue;
                }

                elemento.style.left =
                    `${trampa.x}px`;

                elemento.style.top =
                    `${trampa.y}px`;
            }
        }

        // ==========================================
        // CLICK PARA TRAMPA
        // ==========================================

        cancha.addEventListener(
            "click",
            event => {

                if (
                    !partidaComenzada ||
                    miRol !== "enemigo" ||
                    miJugador.muerto
                ) {
                    return;
                }

                if (
                    Date.now() <
                    cooldownTrampaHasta
                ) {
                    return;
                }

                const rect =
                    cancha.getBoundingClientRect();

                const pantallaX =
                    event.clientX -
                    rect.left;

                const pantallaY =
                    event.clientY -
                    rect.top;

                const mundoX =
                    pantallaX +
                    camaraX;

                const mundoY =
                    pantallaY;

                socket.emit(
                    "colocarTrampa",
                    {
                        x: mundoX,
                        y: mundoY
                    }
                );
            }
        );

        // ==========================================
        // COOLDOWN TRAMPA
        // ==========================================

        socket.on(
            "trampaCooldown",
            duracion => {

                cooldownTrampaHasta =
                    Date.now() +
                    duracion;

                actualizarHUD();
            }
        );

        // ==========================================
        // TRAMPA ACTIVADA
        // ==========================================

        socket.on(
            "trampaActivada",
            datos => {

                const elemento =
                    document.getElementById(
                        `trampa-${datos.trampaId}`
                    );

                if (elemento) {

                    elemento.remove();
                }

                delete trampas[
                    datos.trampaId
                ];
            }
        );

        // ==========================================
        // RALENTIZADO
        // ==========================================

        socket.on(
            "aliadoRalentizado",
            datos => {

                miJugador.ralentizadoHasta =
                    Date.now() +
                    datos.duracion;
            }
        );

        // ==========================================
        // VICTORIA ALIADOS
        // ==========================================

        socket.on(
            "aliadosGanan",
            datos => {

                partidaComenzada =
                    false;

                mostrarMensaje(
                    "¡LOS ALIADOS GANAN!"
                );
            }
        );

        // ==========================================
        // VICTORIA ENEMIGO
        // ==========================================

        socket.on(
            "enemigoGana",
            () => {

                partidaComenzada =
                    false;

                mostrarMensaje(
                    "¡EL ENEMIGO GANA!"
                );
            }
        );

        // ==========================================
        // DESCONEXIÓN
        // ==========================================

        socket.on(
            "jugadorDesconectado",
            () => {

                mostrarMensaje(
                    "Un jugador se desconectó."
                );

                partidaComenzada =
                    false;
            }
        );

        // ==========================================
        // HUD
        // ==========================================

        function actualizarHUD() {

            hudRol.textContent =
                miRol || "-";

            let aliadosVivos = 0;

            for (
                const id in jugadores
            ) {

                const jugador =
                    jugadores[id];

                if (
                    jugador.rol === "aliado" &&
                    !jugador.muerto
                ) {

                    aliadosVivos++;
                }
            }

            if (
                miRol === "aliado" &&
                !miJugador.muerto
            ) {

                aliadosVivos++;
            }

            // Evitar contar al jugador local
            // dos veces si está dentro de jugadores.

            if (
                miRol === "aliado" &&
                jugadores[miId] &&
                !jugadores[miId].muerto
            ) {

                aliadosVivos--;
            }

            hudAliados.textContent =
                `${aliadosVivos}`;

            const progreso =
                Math.max(
                    0,
                    Math.min(
                        100,
                        (
                            miJugador.x /
                            META_X
                        ) *
                        100
                    )
                );

            hudProgreso.textContent =
                `${Math.round(progreso)}%`;

            if (
                miRol === "enemigo"
            ) {

                ayudaTrampa.style.display =
                    "block";

                const restante =
                    cooldownTrampaHasta -
                    Date.now();

                if (restante > 0) {

                    hudCooldown.textContent =
                        `${(
                            restante / 1000
                        ).toFixed(1)} s`;

                } else {

                    hudCooldown.textContent =
                        "Lista";
                }

            } else {

                ayudaTrampa.style.display =
                    "none";

                hudCooldown.textContent =
                    "-";
            }
        }

        // ==========================================
        // MENSAJES
        // ==========================================

        function mostrarMensaje(
            texto,
            duracion = 0
        ) {

            mensaje.textContent =
                texto;

            mensaje.style.display =
                "block";

            if (duracion > 0) {

                setTimeout(
                    () => {

                        mensaje.style.display =
                            "none";

                    },
                    duracion
                );
            }
        }

        // ==========================================
        // DISTANCIA
        // ==========================================

        function distancia(
            x1,
            y1,
            x2,
            y2
        ) {

            const dx =
                x1 - x2;

            const dy =
                y1 - y2;

            return Math.sqrt(
                dx * dx +
                dy * dy
            );
        }

    </script>

</body>

</html>
