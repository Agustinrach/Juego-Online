
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #20232a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #menu,
        #seleccionRol {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            background: #2c3038;
            padding: 25px;
            border-radius: 15px;
        }

        #seleccionRol,
        #juego {
            display: none;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .rol {
            padding: 15px;
            margin-top: 15px;
            border: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
        }

        .rol:hover {
            border-color: white;
        }

        #botonAliado {
            background: #2980b9;
        }

        #botonEnemigo {
            background: #c0392b;
        }

        #botonEnemigo:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #estadoRoles {
            margin-top: 20px;
            line-height: 1.8;
        }

        #mensaje,
        #mensajeRol {
            color: #ffd166;
            margin-top: 15px;
        }

        #informacion {
            padding: 10px;
        }

        #cancha {
            width: 800px;
            height: 500px;
            max-width: 95vw;
            margin: auto;
            background: #6ab04c;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .jugador {
            width: 40px;
            height: 40px;
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        .aliado {
            background: #3498db;
        }

        .enemigo {
            background: #e74c3c;
        }

        .muerto {
            background: #777 !important;
            opacity: 0.7;
        }

        #mensajeJuego {
            font-size: 22px;
            font-weight: bold;
            min-height: 32px;
            color: #ffd166;
        }
    </style>
</head>

<body>
    <div id="menu">
        <h1>🎮 Juego Online</h1>

        <h2>Crear sala</h2>
        <button id="crearSala">Crear sala</button>

        <hr>

        <h2>Unirse</h2>
        <input
            type="text"
            id="codigoInput"
            maxlength="5"
            placeholder="Código de sala"
        >
        <button id="unirseSala">Unirse a sala</button>

        <p id="mensaje"></p>
    </div>

    <div id="seleccionRol">
        <h1>⚔️ Elegí tu equipo</h1>

        <p>Sala: <strong id="codigoSalaRol"></strong></p>

        <div id="botonAliado" class="rol">
            🔵
            <h2>ALIADO</h2>
            <p>Tu objetivo es sobrevivir.</p>
        </div>

        <div id="botonEnemigo" class="rol">
            🔴
            <h2>ENEMIGO</h2>
            <p>Tocá a los 3 aliados.</p>
        </div>

        <div id="estadoRoles">
            🔵 Aliados: <span id="cantidadAliados">0</span>/3
            <br>
            🔴 Enemigo: <span id="estadoEnemigo">Disponible</span>
        </div>

        <div id="rolElegido">No elegiste un equipo.</div>
        <p id="mensajeRol"></p>
    </div>

    <div id="juego">
        <div id="informacion">
            <h2>Sala: <span id="codigoSala"></span></h2>
            <p>Jugadores: <span id="cantidadJugadores">0</span>/4</p>
            <p>Usá W A S D para moverte.</p>
            <div id="mensajeJuego"></div>
        </div>

        <div id="cancha"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const menu = document.getElementById("menu");
        const seleccionRol = document.getElementById("seleccionRol");
        const juego = document.getElementById("juego");
        const crearSala = document.getElementById("crearSala");
        const unirseSala = document.getElementById("unirseSala");
        const codigoInput = document.getElementById("codigoInput");
        const codigoSalaRol = document.getElementById("codigoSalaRol");
        const codigoSala = document.getElementById("codigoSala");
        const cantidadJugadores = document.getElementById("cantidadJugadores");
        const botonAliado = document.getElementById("botonAliado");
        const botonEnemigo = document.getElementById("botonEnemigo");
        const cantidadAliados = document.getElementById("cantidadAliados");
        const estadoEnemigo = document.getElementById("estadoEnemigo");
        const rolElegido = document.getElementById("rolElegido");
        const mensaje = document.getElementById("mensaje");
        const mensajeRol = document.getElementById("mensajeRol");
        const mensajeJuego = document.getElementById("mensajeJuego");
        const cancha = document.getElementById("cancha");

        let miId = null;
        let miRol = null;
        let miJugador = { x: 100, y: 250 };
        let partidaComenzada = false;
        let teclas = {};
        let jugadores = [];
        let ultimoTiempo = 0;
        let ultimoEnvio = 0;
        let posicionLocalInicializada = false;

        const elementosJugadores = new Map();

        // ------------------------------------
        // CONEXIÓN
        // ------------------------------------

        socket.on("connect", () => {
            miId = socket.id;
            console.log("Conectado:", miId);
        });

        socket.on("connect_error", error => {
            mensaje.textContent = "No se pudo conectar al servidor.";
            console.error(error);
        });

        // ------------------------------------
        // SALAS
        // ------------------------------------

        crearSala.addEventListener("click", () => {
            socket.emit("crearSala");
        });

        unirseSala.addEventListener("click", () => {
            const codigo = codigoInput.value.trim().toUpperCase();

            if (!codigo) {
                mensaje.textContent = "Escribí un código.";
                return;
            }

            socket.emit("unirseSala", codigo);
        });

        socket.on("salaCreada", datos => {
            menu.style.display = "none";
            seleccionRol.style.display = "block";
            codigoSalaRol.textContent = datos.codigo;
            codigoSala.textContent = datos.codigo;
            mensaje.textContent = "";
            mensajeRol.textContent = "";
            rolElegido.textContent = "Elegí tu equipo.";
        });

        socket.on("errorSala", texto => {
            mensaje.textContent = texto;
        });

        // ------------------------------------
        // ELEGIR ROL
        // ------------------------------------

        botonAliado.addEventListener("click", () => {
            socket.emit("elegirRol", "aliado");
        });

        botonEnemigo.addEventListener("click", () => {
            if (!botonEnemigo.disabled) {
                socket.emit("elegirRol", "enemigo");
            }
        });

        socket.on("errorRol", texto => {
            mensajeRol.textContent = texto;
        });

        socket.on("actualizarRoles", datos => {
            cantidadAliados.textContent = datos.aliados;

            if (datos.enemigo) {
                estadoEnemigo.textContent = "Ocupado";
                botonEnemigo.disabled = true;
            } else {
                estadoEnemigo.textContent = "Disponible";
                botonEnemigo.disabled = false;
            }

            if (miRol) {
                rolElegido.textContent =
                    miRol === "aliado"
                        ? "Elegiste ser ALIADO."
                        : "Elegiste ser el ENEMIGO.";
            }
        });

        // ------------------------------------
        // CUENTA REGRESIVA
        // ------------------------------------

        socket.on("cuentaRegresiva", segundos => {
            menu.style.display = "none";
            seleccionRol.style.display = "none";
            juego.style.display = "block";

            partidaComenzada = false;
            teclas = {};

            mensajeJuego.textContent =
                `La partida comienza en ${segundos}...`;

            mensajeJuego.style.color = "#f7d879";
        });

        socket.on("cuentaRegresivaCancelada", () => {
            partidaComenzada = false;
            teclas = {};
            juego.style.display = "none";
            seleccionRol.style.display = "block";
            mensajeRol.textContent =
                "Se canceló la cuenta regresiva: falta un jugador o un rol.";
        });

        // ------------------------------------
        // PARTIDA INICIADA
        // ------------------------------------

        socket.on("partidaIniciada", () => {
            partidaComenzada = true;
            posicionLocalInicializada = false;
            ultimoEnvio = 0;
            ultimoTiempo = 0;
            teclas = {};

            seleccionRol.style.display = "none";
            juego.style.display = "block";

            mensajeJuego.textContent = "¡La partida comenzó!";
            mensajeJuego.style.color = "#ffd166";
        });

        socket.on("partidaCancelada", texto => {
            partidaComenzada = false;
            teclas = {};
            mensajeJuego.textContent = texto;
        });

        // ------------------------------------
        // ACTUALIZAR JUGADORES
        // ------------------------------------

        socket.on("actualizarJugadores", lista => {
            jugadores = lista;
            cantidadJugadores.textContent = lista.length;

            const yo = lista.find(j => j.id === miId);

            if (yo) {
                miRol = yo.rol;

                if (!posicionLocalInicializada && partidaComenzada) {
                    miJugador.x = yo.x;
                    miJugador.y = yo.y;
                    posicionLocalInicializada = true;
                }
            }

            mostrarJugadores();
        });

        function mostrarJugadores() {
            const idsActuales = new Set();

            for (const jugador of jugadores) {
                idsActuales.add(jugador.id);

                let elemento = elementosJugadores.get(jugador.id);

                if (!elemento) {
                    elemento = document.createElement("div");
                    elemento.className = "jugador";
                    cancha.appendChild(elemento);
                    elementosJugadores.set(jugador.id, elemento);

                    elemento.dataset.visualX = jugador.x;
                    elemento.dataset.visualY = jugador.y;
                }

                elemento.id = "jugador-" + jugador.id;
                elemento.classList.toggle("aliado", jugador.rol === "aliado");
                elemento.classList.toggle("enemigo", jugador.rol === "enemigo");
                elemento.classList.toggle("muerto", jugador.muerto);

                elemento.dataset.targetX = jugador.x;
                elemento.dataset.targetY = jugador.y;

                if (jugador.id === miId) {
                    miRol = jugador.rol;
                }
            }

            for (const [id, elemento] of elementosJugadores) {
                if (!idsActuales.has(id)) {
                    elemento.remove();
                    elementosJugadores.delete(id);
                }
            }
        }

        // ------------------------------------
        // ALIADO ELIMINADO
        // ------------------------------------

        socket.on("aliadoMuerto", datos => {
            const elemento = elementosJugadores.get(datos.id);

            if (elemento) {
                elemento.classList.add("muerto");
            }

            if (datos.id === miId) {
                teclas = {};
                mensajeJuego.textContent = "💀 ¡Fuiste eliminado!";
            }
        });

        socket.on("enemigoGana", () => {
            partidaComenzada = false;
            teclas = {};
            mensajeJuego.textContent = "🔴 ¡EL ENEMIGO GANA!";
        });

        // ------------------------------------
        // TECLADO
        // ------------------------------------

        document.addEventListener("keydown", evento => {
            const tecla = evento.key.toLowerCase();

            if (["w", "a", "s", "d"].includes(tecla)) {
                evento.preventDefault();

                if (partidaComenzada) {
                    teclas[tecla] = true;
                }
            }
        });

        document.addEventListener("keyup", evento => {
            const tecla = evento.key.toLowerCase();

            if (["w", "a", "s", "d"].includes(tecla)) {
                teclas[tecla] = false;
            }
        });

        window.addEventListener("blur", () => {
            teclas = {};
        });

        // ------------------------------------
        // ENVIAR POSICIÓN AL SERVIDOR
        // ------------------------------------

        function enviarPosicion(ahora) {
            if (ahora - ultimoEnvio < 40) return;

            ultimoEnvio = ahora;

            socket.emit("moverJugador", {
                x: miJugador.x,
                y: miJugador.y
            });
        }

        // ------------------------------------
        // MOVIMIENTO SUAVE
        // ------------------------------------

        function actualizarMovimiento(delta) {
            if (!partidaComenzada) return;

            const velocidad = miRol === "enemigo" ? 180 : 240;
            const segundos = delta / 1000;

            let dx = 0;
            let dy = 0;

            if (teclas["a"]) dx--;
            if (teclas["d"]) dx++;
            if (teclas["w"]) dy--;
            if (teclas["s"]) dy++;

            // Evita que el movimiento diagonal sea más rápido.
            if (dx !== 0 && dy !== 0) {
                dx *= Math.SQRT1_2;
                dy *= Math.SQRT1_2;
            }

            miJugador.x += dx * velocidad * segundos;
            miJugador.y += dy * velocidad * segundos;

            miJugador.x = Math.max(20, Math.min(780, miJugador.x));
            miJugador.y = Math.max(20, Math.min(480, miJugador.y));

            if (dx !== 0 || dy !== 0) {
                enviarPosicion(performance.now());
            }
        }

        // ------------------------------------
        // POSICIONES VISUALES DE OTROS JUGADORES
        // ------------------------------------

        function actualizarPosicionesVisuales() {
            for (const jugador of jugadores) {
                const elemento = elementosJugadores.get(jugador.id);
                if (!elemento) continue;

                if (jugador.id === miId) {
                    elemento.dataset.visualX = miJugador.x;
                    elemento.dataset.visualY = miJugador.y;
                } else {
                    const actualX = Number(elemento.dataset.visualX);
                    const actualY = Number(elemento.dataset.visualY);
                    const destinoX = Number(elemento.dataset.targetX);
                    const destinoY = Number(elemento.dataset.targetY);

                    // Interpolación para reducir saltos visuales.
                    elemento.dataset.visualX = actualX + (destinoX - actualX) * 0.30;
                    elemento.dataset.visualY = actualY + (destinoY - actualY) * 0.30;
                }

                elemento.style.left = `${elemento.dataset.visualX}px`;
                elemento.style.top = `${elemento.dataset.visualY}px`;
            }
        }

        // ------------------------------------
        // BUCLE PRINCIPAL
        // ------------------------------------

        function bucle(ahora) {
            const delta = ultimoTiempo
                ? Math.min(ahora - ultimoTiempo, 40)
                : 16.67;

            ultimoTiempo = ahora;

            actualizarMovimiento(delta);
            actualizarPosicionesVisuales();

            requestAnimationFrame(bucle);
        }

        requestAnimationFrame(bucle);
    </script>
</body>
</html>
